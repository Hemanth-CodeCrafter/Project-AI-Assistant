<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S</title>

    <link rel="stylesheet" href="/frontend/style.css">
</head>
<body>

    <div class="container">

        <h1>J.A.R.V.I.S</h1>

        <div class="status">
            ● ONLINE
        </div>

        <div id="chat-box"></div>

        <div class="controls">

            <input
                id="command"
                type="text"
                placeholder="Enter command..."
            >

            <button id="mic-btn">
                🎤
            </button>

            <button onclick="sendCommand()">
                SEND
            </button>

        </div>

    </div>

    <script src="/frontend/app.js"></script>

</body>
</html>
