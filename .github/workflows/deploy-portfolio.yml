name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "portfolio.css"
      - "portfolio.js"
      - ".github/workflows/deploy-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static portfolio
        run: |
          mkdir -p dist
          cp index.html portfolio.css portfolio.js dist/
          touch dist/.nojekyll

      - name: Upload portfolio artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
